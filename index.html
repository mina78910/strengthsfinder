<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrengthsFinder 資料</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3eb;
      --panel: rgba(255, 255, 255, 0.88);
      --ink: #27313f;
      --muted: #687386;
      --accent: #6f5de7;
      --accent-2: #19a7a8;
      --ring: rgba(111, 93, 231, 0.28);
      --shadow: 0 18px 45px rgba(42, 39, 58, 0.16);
      --radius: 24px;
      --card-min: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 201, 121, 0.38), transparent 34rem),
        radial-gradient(circle at 90% 8%, rgba(119, 215, 216, 0.34), transparent 28rem),
        linear-gradient(135deg, #fbf7ef 0%, var(--bg) 55%, #eef7f7 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .app-shell { width: min(1440px, 100%); margin: 0 auto; padding: clamp(16px, 3vw, 32px); }
    .hero { padding: clamp(12px, 2vw, 24px) 4px 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .78rem; font-weight: 900; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3.2rem); letter-spacing: -.04em; }
    .lead { max-width: 680px; margin: 12px 0 0; color: var(--muted); font-weight: 650; line-height: 1.7; }

    .panel {
      border: 1px solid rgba(255,255,255,.72);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 14px 24px;
      margin-bottom: 22px;
      padding: 16px 58px 16px 16px;
    }
    .toolbar-close {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: rgba(104,115,134,.1);
      font-size: 1.45rem;
      line-height: 1;
    }
    .toolbar-close:hover, .toolbar-close:focus-visible { color: white; background: var(--accent); }
    .toolbar-open {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 11px 16px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: var(--accent);
      box-shadow: var(--shadow);
      font-size: .86rem;
      font-weight: 900;
    }
    .control { display: grid; flex: 1 1 280px; gap: 7px; color: var(--muted); font-size: .86rem; font-weight: 850; }
    .control input[type="search"] {
      width: 100%;
      padding: 11px 15px;
      border: 1px solid rgba(104,115,134,.24);
      border-radius: 999px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,.86);
    }
    .control input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
    .size-control { flex: 1 1 260px; max-width: 420px; }
    .range-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .count { margin-left: auto; padding: 9px 13px; border-radius: 999px; color: var(--accent); background: rgba(111,93,231,.1); font-weight: 900; white-space: nowrap; }

    .csv-section { margin-bottom: 22px; overflow: hidden; }
    .csv-section summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }
    .csv-section summary::-webkit-details-marker { display: none; }
    .csv-section summary::after {
      content: "＋";
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: var(--accent);
      background: rgba(111,93,231,.1);
      font-size: 1.2rem;
    }
    .csv-section[open] summary::after { content: "−"; }
    .summary-text { display: grid; gap: 4px; }
    .summary-text small { color: var(--muted); font-weight: 700; }
    .csv-content { padding: 0 20px 20px; }
    .csv-status { margin: 0; padding: 18px; color: var(--muted); text-align: center; font-weight: 800; }
    .table-wrap { overflow-x: auto; border: 1px solid rgba(104,115,134,.18); border-radius: 16px; }
    .csv-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,.64); font-size: .9rem; }
    .csv-table th, .csv-table td { padding: 11px 13px; border-bottom: 1px solid rgba(104,115,134,.14); text-align: left; white-space: nowrap; }
    .csv-table th { position: sticky; top: 0; color: var(--accent); background: #f5f2ff; font-size: .82rem; }
    .csv-table tbody tr:last-child td { border-bottom: 0; }
    .csv-table tbody tr:hover { background: rgba(25,167,168,.07); }

    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr)); gap: 18px; align-items: start; }
    .card { overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
    .card:hover, .card:focus-within { z-index: 2; transform: translateY(-4px); box-shadow: 0 22px 54px rgba(42,39,58,.2); }
    .image-button { display: block; width: 100%; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
    .image-wrap { aspect-ratio: 16 / 10; overflow: hidden; background: #e8edf4; }
    .image-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; transition: transform .25s ease; }
    .card:hover img { transform: scale(1.015); }
    .caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: rgba(255,255,255,.68); }
    .caption strong { font-size: 1rem; }
    .open-label { color: var(--accent); font-size: .78rem; font-weight: 900; }
    .related { padding: 0 16px 16px; background: rgba(255,255,255,.68); }
    .related-title { margin: 0 0 8px; color: var(--muted); font-size: .75rem; font-weight: 850; }
    .related-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .related-tag {
      padding: 7px 12px;
      border: 1px solid rgba(111,93,231,.2);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(111,93,231,.09);
      font-size: .82rem;
      font-weight: 900;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .related-tag:hover, .related-tag:focus-visible { color: white; background: var(--accent); transform: translateY(-1px); }
    .card.is-jump-target { animation: jump-highlight 1.4s ease; }
    @keyframes jump-highlight {
      0%, 100% { box-shadow: var(--shadow); }
      35% { box-shadow: 0 0 0 6px var(--ring), 0 22px 54px rgba(42,39,58,.2); }
    }
    .empty { grid-column: 1 / -1; margin: 0; padding: 40px; color: var(--muted); text-align: center; font-weight: 800; }

    @media (max-width: 600px) {
      .app-shell { padding: 12px; }
      .toolbar { top: 6px; gap: 12px; padding: 52px 16px 16px; }
      .count { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">STRENGTHSFINDER ARCHIVE</p>
      <h1>ストレングスファインダー資料</h1>
      <p class="lead">各資質の画像をまとめて閲覧できます。画像を選択すると、大きなサイズで表示します。</p>
    </header>

    <section id="toolbar" class="toolbar panel" aria-label="表示設定">
      <button id="toolbarClose" class="toolbar-close" type="button" aria-controls="toolbar" aria-label="表示設定を閉じる">×</button>
      <label class="control" for="search">
        資質名で検索
        <input id="search" type="search" placeholder="例：戦略性、共感性" autocomplete="off">
      </label>
      <label class="control size-control" for="cardSize">
        画像サイズ
        <span class="range-row"><span>小</span><input id="cardSize" type="range" min="200" max="1180" value="280" step="20"><span>大</span></span>
      </label>
      <output id="count" class="count" aria-live="polite"></output>
    </section>
    <button id="toolbarOpen" class="toolbar-open" type="button" aria-controls="toolbar" hidden>表示設定を開く</button>

    <details id="csvSection" class="csv-section panel">
      <summary>
        <span class="summary-text">
          CSVデータを見る
          <small>34資質のカテゴリと一言説明</small>
        </span>
      </summary>
      <div id="csvContent" class="csv-content" aria-live="polite">
        <p class="csv-status">セクションを開くとデータを読み込みます。</p>
      </div>
    </details>

    <section id="gallery" class="gallery" aria-label="資質画像一覧"></section>
  </main>

  <script>
    // Browserだけではフォルダを列挙できないため、同階層の画像ファイル名をここで管理します。
    const imageNames = [
      "アレンジ", "コミュニケーション", "ポジティブ", "信念", "個別化", "公平性", "共感性",
      "内省", "分析思考", "包含", "原点思考", "収集心", "回復志向", "学習欲", "慎重さ",
      "成長促進", "戦略性", "指令性", "最上志向", "未来志向", "活発性", "目標志向", "着想",
      "社交性", "競争性", "自己確信", "自我", "規律性", "親密性", "調和性", "責任感",
      "運命思考", "達成欲", "適応性"
    ];

    // 見分けにくい資質を相互に行き来できるよう、資質名ごとに関連先を定義します。
    const relatedStrengths = {
      "達成欲": ["責任感"],
      "責任感": ["達成欲"],
      "社交性": ["コミュニケーション"],
      "コミュニケーション": ["社交性"],
      "目標志向": ["最上志向"],
      "最上志向": ["目標志向"]
    };

    const toolbar = document.querySelector(".toolbar");
    const toolbarClose = document.querySelector("#toolbarClose");
    const toolbarOpen = document.querySelector("#toolbarOpen");
    const gallery = document.querySelector("#gallery");
    const search = document.querySelector("#search");
    const cardSize = document.querySelector("#cardSize");
    const count = document.querySelector("#count");
    const csvSection = document.querySelector("#csvSection");
    const csvContent = document.querySelector("#csvContent");
    let visibleImages = imageNames;
    let csvLoaded = false;

    toolbarClose.addEventListener("click", () => {
      toolbar.hidden = true;
      toolbarOpen.hidden = false;
      toolbarOpen.focus();
    });

    toolbarOpen.addEventListener("click", () => {
      toolbar.hidden = false;
      toolbarOpen.hidden = true;
      toolbarClose.focus();
    });

    const imagePath = (name) => `strength_detail/${encodeURIComponent(name)}.png`;

    function render() {
      const query = search.value.trim().toLocaleLowerCase("ja");
      visibleImages = imageNames.filter((name) => name.toLocaleLowerCase("ja").includes(query));
      count.textContent = `${visibleImages.length} / ${imageNames.length} 件`;
      gallery.innerHTML = visibleImages.length
        ? visibleImages.map((name, index) => `
          <article id="strength-${name}" class="card panel">
            <button class="image-button" type="button" data-index="${index}" aria-label="${name}を拡大表示">
              <div class="image-wrap"><img src="${imagePath(name)}" alt="${name}の資料" loading="lazy" decoding="async"></div>
              <div class="caption"><strong>${name}</strong><span class="open-label">クリックで拡大</span></div>
            </button>
            ${renderRelatedStrengths(name)}
          </article>`).join("")
        : `<p class="empty panel">「${escapeHtml(search.value.trim())}」に一致する画像はありません。</p>`;
    }

    function renderRelatedStrengths(name) {
      const related = relatedStrengths[name];
      if (!related?.length) return "";
      return `
        <nav class="related" aria-label="${name}と混同しやすいタイプ">
          <p class="related-title">混同しやすいタイプ</p>
          <div class="related-tags">
            ${related.map((relatedName) => `<button class="related-tag" type="button" data-related="${relatedName}">${relatedName}</button>`).join("")}
          </div>
        </nav>`;
    }

    function escapeHtml(value) {
      const node = document.createElement("div");
      node.textContent = value;
      return node.innerHTML;
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === '"' && quoted && text[index + 1] === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          quoted = !quoted;
        } else if (character === "," && !quoted) {
          row.push(field);
          field = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(field);
          if (row.some((value) => value !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }
      if (field || row.length) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    function renderCsv(rows) {
      const [headers, ...dataRows] = rows;
      if (!headers) throw new Error("CSVにデータがありません。");
      csvContent.innerHTML = `
        <div class="table-wrap">
          <table class="csv-table">
            <thead><tr>${headers.map((header) => `<th scope="col">${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>${dataRows.map((row) => `<tr>${headers.map((_, index) => `<td>${escapeHtml(row[index] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>`;
    }

    csvSection.addEventListener("toggle", async () => {
      if (!csvSection.open || csvLoaded) return;
      csvContent.innerHTML = `<p class="csv-status">CSVデータを読み込んでいます…</p>`;
      try {
        const response = await fetch("strengths.csv");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderCsv(parseCsv(await response.text()));
        csvLoaded = true;
      } catch (error) {
        csvContent.innerHTML = `<p class="csv-status">CSVデータを読み込めませんでした。ページをWebサーバー経由で開いてください。</p>`;
        console.error(error);
      }
    });

    gallery.addEventListener("click", (event) => {
      const relatedTag = event.target.closest("[data-related]");
      if (relatedTag) {
        const targetName = relatedTag.dataset.related;
        search.value = "";
        render();
        requestAnimationFrame(() => {
          const targetCard = document.getElementById(`strength-${targetName}`);
          targetCard?.scrollIntoView({ behavior: "smooth", block: "center" });
          targetCard?.classList.add("is-jump-target");
          window.setTimeout(() => targetCard?.classList.remove("is-jump-target"), 1400);
        });
        return;
      }
      const button = event.target.closest("[data-index]");
      if (!button) return;
      cardSize.value = cardSize.max;
      document.documentElement.style.setProperty("--card-min", `${cardSize.max}px`);
      button.closest(".card")?.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    search.addEventListener("input", render);
    cardSize.addEventListener("input", () => document.documentElement.style.setProperty("--card-min", `${cardSize.value}px`));
    render();
  </script>
</body>
</html>
